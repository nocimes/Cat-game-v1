<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>우동이 간식탐험</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }
    body {
      background-color: #1a1a24;
      color: #fff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    #game-container {
      position: relative;
      width: 100%;
      max-width: 600px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .header {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 15px;
      box-sizing: border-box;
    }
    h1 {
      margin: 0;
      font-size: 18px;
      color: #ffd166;
      text-shadow: 2px 2px #000;
    }
    .audio-btn {
      background: #444;
      border: 2px solid #666;
      color: #fff;
      border-radius: 20px;
      padding: 5px 12px;
      font-size: 12px;
      cursor: pointer;
    }
    canvas {
      width: 100%;
      height: auto;
      background-color: #fdf6e3;
      border: 4px solid #4a3b32;
      border-radius: 8px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }
    .controls-hint {
      margin-top: 10px;
      font-size: 13px;
      color: #aaa;
      text-align: center;
    }
    .touch-jump-btn {
      margin-top: 15px;
      width: 90%;
      padding: 15px;
      background: linear-gradient(180deg, #ff9f43, #ee5253);
      color: white;
      font-size: 20px;
      font-weight: bold;
      border: none;
      border-radius: 12px;
      box-shadow: 0 5px 0 #b12829;
      cursor: pointer;
      display: block;
    }
    .touch-jump-btn:active {
      transform: translateY(4px);
      box-shadow: 0 1px 0 #b12829;
    }
  </style>
</head>
<body>

<div id="game-container">
  <div class="header">
    <h1>🐱 우동이 간식탐험</h1>
    <button class="audio-btn" id="audioToggle">🔊 음소거</button>
  </div>
  <canvas id="gameCanvas" width="600" height="320"></canvas>
  <button class="touch-jump-btn" id="jumpBtn">🦘 점프! (터치)</button>
  <div class="controls-hint">🐱 2단 점프 가능! (화면 연속 터치 / 스페이스바 / 버튼)</div>
</div>

<script>
  // Web Audio API Synth Engine for Cute 8-bit Sounds & BGM
  class CuteAudioEngine {
    constructor() {
      this.ctx = null;
      this.muted = false;
      this.bgmTimer = null;
      this.bgmIndex = 0;
      
      this.melody = [
        { note: 523.25, duration: 0.2 },
        { note: 659.25, duration: 0.2 },
        { note: 783.99, duration: 0.2 },
        { note: 880.00, duration: 0.2 },
        { note: 1046.50, duration: 0.4 },
        { note: 880.00, duration: 0.2 },
        { note: 783.99, duration: 0.4 },
        { note: 659.25, duration: 0.2 },
        { note: 587.33, duration: 0.2 },
        { note: 523.25, duration: 0.4 },
      ];
    }

    init() {
      if (!this.ctx) {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        this.ctx = new AudioCtx();
      }
      if (this.ctx.state === 'suspended') {
        this.ctx.resume();
      }
    }

    playJump(isDouble = false) {
      if (this.muted) return;
      this.init();
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      
      const startFreq = isDouble ? 500 : 300;
      const endFreq = isDouble ? 1100 : 800;
      
      osc.type = 'square';
      osc.frequency.setValueAtTime(startFreq, this.ctx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(endFreq, this.ctx.currentTime + 0.12);
      
      gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
      gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.12);
      
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start();
      osc.stop(this.ctx.currentTime + 0.12);
    }

    playCanSound() {
      if (this.muted) return;
      this.init();
      
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(1400, this.ctx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(350, this.ctx.currentTime + 0.04);
      gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
      gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.04);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start();
      osc.stop(this.ctx.currentTime + 0.04);

      const bufferSize = this.ctx.sampleRate * 0.1;
      const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) {
        data[i] = Math.random() * 2 - 1;
      }
      const noise = this.ctx.createBufferSource();
      noise.buffer = buffer;
      const noiseGain = this.ctx.createGain();
      noiseGain.gain.setValueAtTime(0.15, this.ctx.currentTime + 0.02);
      noiseGain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.1);
      noise.connect(noiseGain);
      noiseGain.connect(this.ctx.destination);
      noise.start(this.ctx.currentTime + 0.02);
    }

    playChurruSound() {
      if (this.muted) return;
      this.init();
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(450, this.ctx.currentTime);
      osc.frequency.linearRampToValueAtTime(900, this.ctx.currentTime + 0.08);
      osc.frequency.linearRampToValueAtTime(600, this.ctx.currentTime + 0.18);
      
      gain.gain.setValueAtTime(0.25, this.ctx.currentTime);
      gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.18);
      
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start();
      osc.stop(this.ctx.currentTime + 0.18);
    }

    playCrunchSound() {
      if (this.muted) return;
      this.init();
      const bufferSize = this.ctx.sampleRate * 0.07;
      const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) {
        data[i] = (Math.random() * 2 - 1) * (i % 60 < 30 ? 1 : 0.3);
      }
      const noise = this.ctx.createBufferSource();
      noise.buffer = buffer;
      const gain = this.ctx.createGain();
      gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.07);
      noise.connect(gain);
      gain.connect(this.ctx.destination);
      noise.start();
    }

    playGameOver() {
      if (this.muted) return;
      this.init();
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(400, this.ctx.currentTime);
      osc.frequency.linearRampToValueAtTime(120, this.ctx.currentTime + 0.4);
      
      gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
      gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.4);
      
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start();
      osc.stop(this.ctx.currentTime + 0.4);
    }

    startBGM() {
      if (this.bgmTimer) return;
      this.init();
      this.playNextBGMNote();
    }

    playNextBGMNote() {
      if (this.muted) {
        this.bgmTimer = setTimeout(() => this.playNextBGMNote(), 300);
        return;
      }
      this.init();
      const item = this.melody[this.bgmIndex];
      
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(item.note, this.ctx.currentTime);
      
      gain.gain.setValueAtTime(0.05, this.ctx.currentTime);
      gain.gain.linearRampToValueAtTime(0.005, this.ctx.currentTime + item.duration * 0.9);
      
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      
      osc.start();
      osc.stop(this.ctx.currentTime + item.duration * 0.9);
      
      this.bgmIndex = (this.bgmIndex + 1) % this.melody.length;
      this.bgmTimer = setTimeout(() => this.playNextBGMNote(), item.duration * 1000);
    }
  }

  const audio = new CuteAudioEngine();
  const audioBtn = document.getElementById('audioToggle');
  audioBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    audio.muted = !audio.muted;
    audioBtn.textContent = audio.muted ? '🔇 음소거 중' : '🔊 소리 켬';
  });

  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');

  let score = 0;
  let fishesCollected = 0;
  let highScore = localStorage.getItem('cat_high_score') || 0;
  let gameOver = false;
  let gameStarted = false;
  let frame = 0;

  const cat = {
    x: 70,
    y: 210,
    width: 48,
    height: 34,
    dy: 0,
    gravity: 0.65,
    jumpPower: -11.2,
    isGrounded: true,
    jumpCount: 0,
    maxJumps: 2,
    legFrame: 0,

    draw() {
      ctx.save();
      
      ctx.fillStyle = 'rgba(0,0,0,0.15)';
      ctx.beginPath();
      ctx.ellipse(this.x + 22, 242, 20, 5, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#7a5e4b';
      ctx.fillRect(this.x + 4, this.y + 8, 36, 22);

      ctx.fillStyle = '#3d2e24';
      ctx.fillRect(this.x + 12, this.y + 10, 4, 16);
      ctx.fillRect(this.x + 20, this.y + 10, 4, 16);
      ctx.fillRect(this.x + 28, this.y + 10, 4, 16);

      ctx.fillStyle = '#7a5e4b';
      ctx.fillRect(this.x + 28, this.y - 6, 20, 20);

      ctx.fillStyle = '#9e806c';
      ctx.fillRect(this.x + 38, this.y + 6, 10, 8);

      ctx.fillStyle = '#3d2e24';
      ctx.fillRect(this.x + 30, this.y - 14, 6, 8);
      ctx.fillRect(this.x + 40, this.y - 14, 6, 8);
      ctx.fillStyle = '#fca5a5';
      ctx.fillRect(this.x + 32, this.y - 12, 3, 5);
      ctx.fillRect(this.x + 42, this.y - 12, 3, 5);

      ctx.fillStyle = '#10b981';
      ctx.fillRect(this.x + 40, this.y, 5, 5);
      ctx.fillStyle = '#042f2e';
      ctx.fillRect(this.x + 42, this.y + 1, 2, 3);

      ctx.fillStyle = '#ffffff';
      ctx.fillRect(this.x + 46, this.y + 8, 6, 1);
      ctx.fillRect(this.x + 46, this.y + 11, 6, 1);

      ctx.fillStyle = '#3d2e24';
      const tailAnim = Math.sin(frame * 0.25) * 5;
      ctx.fillRect(this.x - 8, this.y + 6 + tailAnim, 12, 5);

      ctx.fillStyle = '#3d2e24';
      if (this.isGrounded) {
        this.legFrame = (this.legFrame + 0.3) % 4;
        const offset = Math.sin(this.legFrame) * 4;
        ctx.fillRect(this.x + 8 + offset, this.y + 30, 6, 6);
        ctx.fillRect(this.x + 28 - offset, this.y + 30, 6, 6);
      } else {
        ctx.fillRect(this.x + 4, this.y + 28, 8, 5);
        ctx.fillRect(this.x + 32, this.y + 28, 8, 5);
      }

      ctx.restore();
    },

    jump() {
      if (this.jumpCount < this.maxJumps) {
        this.dy = this.jumpPower;
        this.isGrounded = false;
        this.jumpCount++;
        audio.playJump(this.jumpCount === 2);
      }
    },

    update() {
      this.dy += this.gravity;
      this.y += this.dy;

      if (this.y >= 208) {
        this.y = 208;
        this.dy = 0;
        this.isGrounded = true;
        this.jumpCount = 0;
      }
      this.draw();
    }
  };

  const obstacles = [];
  const fishes = [];
  const floatingTexts = [];
  let obstacleTimer = 0;
  let fishTimer = 0;

  function createObstacle() {
    const types = ['ball', 'box', 'tall_box'];
    const type = types[Math.floor(Math.random() * types.length)];
    let h = 26;
    let y = 216;

    if (type === 'tall_box') {
      h = 44;
      y = 198;
    }

    obstacles.push({
      x: canvas.width,
      y: y,
      width: 24,
      height: h,
      type: type,
      speed: 5.5 + Math.floor(score / 180) * 0.6
    });
  }

  function createFish() {
    fishes.push({
      x: canvas.width,
      y: 130 + Math.random() * 50,
      width: 20,
      height: 14,
      speed: 4.8 + Math.floor(score / 200) * 0.5,
      bob: Math.random() * 10
    });
  }

  function handleInput() {
    audio.startBGM();
    if (!gameStarted) {
      gameStarted = true;
      restartGame();
      return;
    }
    if (gameOver) {
      restartGame();
    } else {
      cat.jump();
    }
  }

  window.addEventListener('keydown', (e) => {
    if (e.code === 'Space' || e.code === 'ArrowUp') {
      e.preventDefault();
      handleInput();
    }
  });

  canvas.addEventListener('touchstart', (e) => {
    e.preventDefault();
    handleInput();
  }, { passive: false });

  canvas.addEventListener('mousedown', (e) => {
    handleInput();
  });

  document.getElementById('jumpBtn').addEventListener('touchstart', (e) => {
    e.preventDefault();
    handleInput();
  }, { passive: false });

  document.getElementById('jumpBtn').addEventListener('click', (e) => {
    handleInput();
  });

  const humanTypes = [
    { name: '터보', count: 10, color: '#3b82f6', hairColor: '#27272a', hairStyle: 'short', glasses: true },
    { name: '누렁', count: 8, color: '#ec4899', hairColor: '#451a03', hairStyle: 'long', glasses: false },
    { name: '유', count: 5, color: '#8b5cf6', hairColor: '#18181b', hairStyle: 'long_girl', glasses: false },
    { name: '아', count: 5, color: '#f59e0b', hairColor: '#525252', hairStyle: 'braids', glasses: false }
  ];

  let activeHuman = null;
  let nextHumanScore = 3000;
  const treats = [];

  function spawnHuman() {
    if (activeHuman || !gameStarted || gameOver) return;
    const type = humanTypes[Math.floor(Math.random() * humanTypes.length)];
    activeHuman = {
      ...type,
      x: canvas.width + 30,
      y: 160,
      targetX: canvas.width - 90,
      state: 'entering',
      timer: 0,
      thrownCount: 0
    };
  }

  function drawHuman(h) {
    ctx.save();

    ctx.fillStyle = h.color;
    ctx.fillRect(h.x + 6, h.y + 24, 20, 28);

    ctx.fillStyle = '#fde047';
    ctx.fillRect(h.x + 8, h.y + 6, 16, 18);

    ctx.fillStyle = h.hairColor;
    if (h.hairStyle === 'short') {
      ctx.fillRect(h.x + 6, h.y + 2, 20, 8);
    } else if (h.hairStyle === 'long') {
      ctx.fillRect(h.x + 6, h.y + 2, 20, 10);
      ctx.fillRect(h.x + 4, h.y + 10, 6, 22);
      ctx.fillRect(h.x + 22, h.y + 10, 6, 22);
    } else if (h.hairStyle === 'long_girl') {
      ctx.fillRect(h.x + 6, h.y + 2, 20, 8);
      ctx.fillRect(h.x + 4, h.y + 8, 5, 26);
      ctx.fillRect(h.x + 23, h.y + 8, 5, 26);
    } else if (h.hairStyle === 'braids') {
      ctx.fillRect(h.x + 6, h.y + 2, 20, 8);
      ctx.fillRect(h.x + 2, h.y + 10, 5, 20);
      ctx.fillRect(h.x + 25, h.y + 10, 5, 20);
      ctx.fillStyle = '#ef4444';
      ctx.fillRect(h.x + 1, h.y + 22, 7, 3);
      ctx.fillRect(h.x + 24, h.y + 22, 7, 3);
    }

    if (h.glasses) {
      ctx.fillStyle = '#1e293b';
      ctx.fillRect(h.x + 10, h.y + 12, 5, 5);
      ctx.fillRect(h.x + 17, h.y + 12, 5, 5);
      ctx.fillRect(h.x + 15, h.y + 14, 2, 1);
    } else {
      ctx.fillStyle = '#000000';
      ctx.fillRect(h.x + 11, h.y + 13, 3, 3);
      ctx.fillRect(h.x + 18, h.y + 13, 3, 3);
    }

    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 13px Courier New';
    ctx.textAlign = 'center';
    ctx.fillText(h.name, h.x + 16, h.y - 6);

    ctx.restore();
  }

  function updateHuman() {
    if (!activeHuman) return;

    const h = activeHuman;

    if (h.state === 'entering') {
      h.x -= 3;
      if (h.x <= h.targetX) {
        h.state = 'throwing';
      }
    } else if (h.state === 'throwing') {
      h.timer++;
      if (h.timer % 12 === 0 && h.thrownCount < h.count) {
        const snackTypes = ['can', 'churru', 'biscuit'];
        const type = snackTypes[Math.floor(Math.random() * snackTypes.length)];
        let pts = 200;
        let w = 20, hHeight = 18;

        if (type === 'can') { pts = 300; w = 20; hHeight = 18; }
        else if (type === 'churru') { pts = 250; w = 24; hHeight = 10; }
        else if (type === 'biscuit') { pts = 200; w = 20; hHeight = 14; }

        treats.push({
          x: h.x,
          y: h.y + 10,
          vx: -(3 + Math.random() * 4),
          vy: -(4 + Math.random() * 4),
          gravity: 0.25,
          width: w,
          height: hHeight,
          type: type,
          points: pts
        });
        h.thrownCount++;
      }
      if (h.thrownCount >= h.count && h.timer > h.count * 12 + 20) {
        h.state = 'leaving';
      }
    } else if (h.state === 'leaving') {
      h.x += 4;
      if (h.x > canvas.width + 50) {
        activeHuman = null;
      }
    }

    drawHuman(h);
  }

  function restartGame() {
    activeHuman = null;
    nextHumanScore = 3000;
    treats.length = 0;
    floatingTexts.length = 0;
    cat.y = 208;
    cat.dy = 0;
    obstacles.length = 0;
    fishes.length = 0;
    score = 0;
    fishesCollected = 0;
    gameOver = false;
    obstacleTimer = 0;
    fishTimer = 0;
  }

  function gameLoop() {
    frame++;
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    const skyGradient = ctx.createLinearGradient(0, 0, 0, 240);
    skyGradient.addColorStop(0, '#fef3c7');
    skyGradient.addColorStop(1, '#fde68a');
    ctx.fillStyle = skyGradient;
    ctx.fillRect(0, 0, canvas.width, 240);

    ctx.fillStyle = '#78350f';
    ctx.fillRect(0, 240, canvas.width, 80);
    ctx.fillStyle = '#a16207';
    ctx.fillRect(0, 240, canvas.width, 6);

    ctx.fillStyle = '#92400e';
    for (let i = 0; i < canvas.width; i += 30) {
      const offsetX = (i - (frame * 2)) % canvas.width;
      const posX = offsetX < 0 ? offsetX + canvas.width : offsetX;
      ctx.fillRect(posX, 255, 12, 3);
    }

    if (!gameStarted) {
      cat.draw();
      ctx.fillStyle = '#451a03';
      ctx.font = 'bold 22px Courier New';
      ctx.textAlign = 'center';
      ctx.fillText('🐱 터치하거나 버튼을 눌러 시작!', canvas.width / 2, 120);
      ctx.font = '14px Courier New';
      ctx.fillText(`최고 기록: ${highScore}점`, canvas.width / 2, 150);
      requestAnimationFrame(gameLoop);
      return;
    }

    if (!gameOver) {
      score++;
      if (score > highScore) {
        highScore = score;
        localStorage.setItem('cat_high_score', highScore);
      }
    }

    cat.update();

    if (score >= nextHumanScore) {
      spawnHuman();
      nextHumanScore += 3000;
    }

    updateHuman();

    for (let i = treats.length - 1; i >= 0; i--) {
      const t = treats[i];
      if (!gameOver) {
        t.x += t.vx;
        t.y += t.vy;
        t.vy += t.gravity;

        if (t.y >= 222) {
          t.y = 222;
          t.vy = 0;
          t.vx = -3;
        }
      }

      ctx.save();
      if (t.type === 'can') {
        ctx.fillStyle = '#0284c7';
        ctx.fillRect(t.x, t.y + 3, t.width, t.height - 3);
        ctx.fillStyle = '#e2e8f0';
        ctx.fillRect(t.x, t.y, t.width, 3);
        ctx.fillRect(t.x + 6, t.y - 2, 8, 2);
      } else if (t.type === 'churru') {
        ctx.fillStyle = '#f43f5e';
        ctx.fillRect(t.x, t.y, t.width, t.height);
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(t.x + 4, t.y + 2, 2, t.height - 4);
        ctx.fillStyle = '#fde047';
        ctx.fillRect(t.x + t.width - 4, t.y, 4, t.height);
      } else {
        ctx.fillStyle = '#d97706';
        ctx.fillRect(t.x, t.y + 2, 14, 10);
        ctx.fillRect(t.x + 14, t.y, 6, 14);
        ctx.fillStyle = '#fef08a';
        ctx.fillRect(t.x + 3, t.y + 4, 3, 3);
      }
      ctx.restore();

      if (
        cat.x < t.x + t.width &&
        cat.x + cat.width > t.x &&
        cat.y < t.y + t.height &&
        cat.y + cat.height > t.y
      ) {
        if (t.type === 'can') {
          audio.playCanSound();
        } else if (t.type === 'churru') {
          audio.playChurruSound();
        } else {
          audio.playCrunchSound();
        }

        floatingTexts.push({
          x: t.x,
          y: t.y,
          text: `+${t.points}`,
          alpha: 1.0,
          vy: -1.5,
          color: t.type === 'can' ? '#38bdf8' : (t.type === 'churru' ? '#fb7185' : '#fbbf24')
        });

        treats.splice(i, 1);
        score += (t.points || 200);
        fishesCollected++;
        continue;
      }

      if (t.x + t.width < 0) treats.splice(i, 1);
    }

    obstacleTimer++;
    if (obstacleTimer > 52 + Math.random() * 35) {
      createObstacle();
      obstacleTimer = 0;
    }

    fishTimer++;
    if (fishTimer > 110 + Math.random() * 60) {
      createFish();
      fishTimer = 0;
    }

    for (let i = fishes.length - 1; i >= 0; i--) {
      const f = fishes[i];
      if (!gameOver) f.x -= f.speed;

      const floatY = f.y + Math.sin(frame * 0.1 + f.bob) * 4;
      ctx.fillStyle = '#f97316';
      ctx.fillRect(f.x, floatY, 14, 10);
      ctx.fillRect(f.x + 14, floatY - 3, 6, 16);
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(f.x + 3, floatY + 2, 3, 3);

      if (
        cat.x < f.x + f.width &&
        cat.x + cat.width > f.x &&
        cat.y < floatY + f.height &&
        cat.y + cat.height > floatY
      ) {
        audio.playCrunchSound();
        floatingTexts.push({
          x: f.x,
          y: floatY,
          text: `+150`,
          alpha: 1.0,
          vy: -1.5,
          color: '#f97316'
        });

        fishes.splice(i, 1);
        score += 150;
        fishesCollected++;
        continue;
      }

      if (f.x + f.width < 0) fishes.splice(i, 1);
    }

    for (let i = obstacles.length - 1; i >= 0; i--) {
      const obs = obstacles[i];
      if (!gameOver) obs.x -= obs.speed;

      if (obs.type === 'ball') {
        ctx.fillStyle = '#ef4444';
        ctx.beginPath();
        ctx.arc(obs.x + 12, obs.y + 12, 12, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#b91c1c';
        ctx.fillRect(obs.x + 4, obs.y + 8, 16, 4);
      } else if (obs.type === 'tall_box') {
        ctx.fillStyle = '#b45309';
        ctx.fillRect(obs.x, obs.y, obs.width, obs.height);
        ctx.fillStyle = '#78350f';
        ctx.fillRect(obs.x + 2, obs.y + 2, obs.width - 4, 4);
        ctx.fillRect(obs.x + 2, obs.y + 22, obs.width - 4, 4);
      } else {
        ctx.fillStyle = '#d97706';
        ctx.fillRect(obs.x, obs.y, obs.width, obs.height);
        ctx.fillStyle = '#92400e';
        ctx.fillRect(obs.x + 2, obs.y + 2, obs.width - 4, 4);
      }

      if (
        cat.x + 6 < obs.x + obs.width &&
        cat.x + cat.width - 6 > obs.x &&
        cat.y + 6 < obs.y + obs.height &&
        cat.y + cat.height > obs.y
      ) {
        if (!gameOver) {
          gameOver = true;
          audio.playGameOver();
        }
      }

      if (obs.x + obs.width < 0) obstacles.splice(i, 1);
    }

    for (let i = floatingTexts.length - 1; i >= 0; i--) {
      const ft = floatingTexts[i];
      if (!gameOver) {
        ft.y += ft.vy;
        ft.alpha -= 0.025;
      }

      ctx.save();
      ctx.globalAlpha = Math.max(0, ft.alpha);
      ctx.fillStyle = ft.color || '#fde047';
      ctx.font = 'bold 16px Courier New';
      ctx.textAlign = 'center';
      ctx.fillText(ft.text, ft.x + 10, ft.y);
      ctx.restore();

      if (ft.alpha <= 0) floatingTexts.splice(i, 1);
    }

    ctx.fillStyle = '#451a03';
    ctx.font = 'bold 16px Courier New';
    ctx.textAlign = 'left';
    ctx.fillText(`SCORE: ${score}`, 15, 28);
    ctx.fillText(`🐟 x ${fishesCollected}`, 150, 28);
    ctx.textAlign = 'right';
    ctx.fillText(`BEST: ${highScore}`, canvas.width - 15, 28);

    if (gameOver) {
      ctx.fillStyle = 'rgba(0, 0, 0, 0.65)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = '#ffffff';
      ctx.textAlign = 'center';
      ctx.font = 'bold 26px Courier New';
      ctx.fillText('GAME OVER', canvas.width / 2, 110);
      
      ctx.font = '16px Courier New';
      ctx.fillStyle = '#fde047';
      ctx.fillText(`최종 점수: ${score}점 (간식 ${fishesCollected}개)`, canvas.width / 2, 150);
      
      ctx.fillStyle = '#ffffff';
      ctx.font = '14px Courier New';
      ctx.fillText('화면을 터치하여 다시 시작', canvas.width / 2, 190);
    }

    requestAnimationFrame(gameLoop);
  }

  gameLoop();
</script>
