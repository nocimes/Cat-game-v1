<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>우동이 간식탐험 Deluxe - Stage & Boss</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }
    body {
      background-color: #1a1a24;
      color: #fff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    #game-container {
      position: relative;
      width: 100%;
      max-width: 600px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .header {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 15px;
      box-sizing: border-box;
    }
    h1 {
      margin: 0;
      font-size: 18px;
      color: #ffd166;
      text-shadow: 2px 2px #000;
    }
    .audio-btn {
      background: #444;
      border: 2px solid #666;
      color: #fff;
      border-radius: 20px;
      padding: 5px 12px;
      font-size: 12px;
      cursor: pointer;
    }
    canvas {
      width: 100%;
      height: auto;
      background-color: #fdf6e3;
      border: 4px solid #4a3b32;
      border-radius: 8px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }
    .controls-hint {
      margin-top: 10px;
      font-size: 12px;
      color: #aaa;
      text-align: center;
      line-height: 1.4;
    }
    .touch-jump-btn {
      margin-top: 12px;
      width: 90%;
      padding: 15px;
      background: linear-gradient(180deg, #ff9f43, #ee5253);
      color: white;
      font-size: 20px;
      font-weight: bold;
      border: none;
      border-radius: 12px;
      box-shadow: 0 5px 0 #b12829;
      cursor: pointer;
      display: block;
    }
    .touch-jump-btn:active {
      transform: translateY(4px);
      box-shadow: 0 1px 0 #b12829;
    }
  </style>
</head>
<body>

<div id="game-container">
  <div class="header">
    <h1>🐱 우동이 간식탐험 Deluxe</h1>
    <button class="audio-btn" id="audioToggle">🔊 음소거</button>
  </div>
  <canvas id="gameCanvas" width="600" height="320"></canvas>
  <button class="touch-jump-btn" id="jumpBtn">🦘 점프! (터치)</button>
  <div class="controls-hint">
    🛡️방어막 | 🌿캣잎(저중력 점프) | 🧲자석(간식흡수) | 💦물뿌리개(시야방해)
  </div>
</div>

<script>
  class CuteAudioEngine {
    constructor() {
      this.ctx = null;
      this.muted = false;
      this.bgmTimer = null;
      this.bgmIndex = 0;
      this.isBossBGM = false;
      
      this.normalMelody = [
        { note: 523.25, duration: 0.25 },
        { note: 659.25, duration: 0.25 },
        { note: 783.99, duration: 0.25 },
        { note: 880.00, duration: 0.25 },
        { note: 1046.50, duration: 0.5 },
        { note: 880.00, duration: 0.25 },
        { note: 783.99, duration: 0.5 },
      ];

      this.bossMelody = [
        { note: 220.00, duration: 0.15 },
        { note: 233.08, duration: 0.15 },
        { note: 220.00, duration: 0.15 },
        { note: 196.00, duration: 0.15 },
        { note: 220.00, duration: 0.30 },
        { note: 329.63, duration: 0.15 },
        { note: 311.13, duration: 0.15 },
      ];
    }

    init() {
      if (!this.ctx) {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        this.ctx = new AudioCtx();
      }
      if (this.ctx.state === 'suspended') {
        this.ctx.resume();
      }
    }

    playJump(isDouble = false) {
      if (this.muted) return;
      this.init();
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      const now = this.ctx.currentTime;
      osc.type = 'square';
      osc.frequency.setValueAtTime(isDouble ? 500 : 300, now);
      osc.frequency.exponentialRampToValueAtTime(isDouble ? 1100 : 800, now + 0.12);
      
      gain.gain.setValueAtTime(0, now);
      gain.gain.linearRampToValueAtTime(0.12, now + 0.01);
      gain.gain.linearRampToValueAtTime(0.01, now + 0.12);
      
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start(now);
      osc.stop(now + 0.12);
    }

    playSnackThrow() {
      if (this.muted) return;
      this.init();
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      const now = this.ctx.currentTime;
      osc.type = 'sine';
      osc.frequency.setValueAtTime(700, now);
      osc.frequency.exponentialRampToValueAtTime(300, now + 0.08);
      
      gain.gain.setValueAtTime(0, now);
      gain.gain.linearRampToValueAtTime(0.15, now + 0.01);
      gain.gain.linearRampToValueAtTime(0.01, now + 0.08);
      
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start(now);
      osc.stop(now + 0.08);
    }

    playCanSound() {
      if (this.muted) return;
      this.init();
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      const now = this.ctx.currentTime;
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(1200, now);
      osc.frequency.exponentialRampToValueAtTime(350, now + 0.05);
      
      gain.gain.setValueAtTime(0, now);
      gain.gain.linearRampToValueAtTime(0.2, now + 0.01);
      gain.gain.linearRampToValueAtTime(0.01, now + 0.05);
      
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start(now);
      osc.stop(now + 0.05);
    }

    playCrunchSound() {
      if (this.muted) return;
      this.init();
      const bufferSize = this.ctx.sampleRate * 0.07;
      const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) {
        data[i] = (Math.random() * 2 - 1) * (i % 60 < 30 ? 1 : 0.3);
      }
      const noise = this.ctx.createBufferSource();
      noise.buffer = buffer;
      const gain = this.ctx.createGain();
      const now = this.ctx.currentTime;
      
      gain.gain.setValueAtTime(0, now);
      gain.gain.linearRampToValueAtTime(0.2, now + 0.005);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.07);
      
      noise.connect(gain);
      gain.connect(this.ctx.destination);
      noise.start(now);
    }

    playHitSound() {
      if (this.muted) return;
      this.init();
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      const now = this.ctx.currentTime;
      osc.type = 'square';
      osc.frequency.setValueAtTime(180, now);
      osc.frequency.linearRampToValueAtTime(60, now + 0.2);
      
      gain.gain.setValueAtTime(0, now);
      gain.gain.linearRampToValueAtTime(0.2, now + 0.01);
      gain.gain.linearRampToValueAtTime(0.01, now + 0.2);
      
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start(now);
      osc.stop(now + 0.2);
    }

    playGameOver() {
      if (this.muted) return;
      this.init();
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      const now = this.ctx.currentTime;
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(400, now);
      osc.frequency.linearRampToValueAtTime(120, now + 0.4);
      
      gain.gain.setValueAtTime(0, now);
      gain.gain.linearRampToValueAtTime(0.2, now + 0.01);
      gain.gain.linearRampToValueAtTime(0.01, now + 0.4);
      
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start(now);
      osc.stop(now + 0.4);
    }

    setBossMode(bossOn) {
      this.isBossBGM = bossOn;
      this.bgmIndex = 0;
    }

    startBGM() {
      if (this.bgmTimer) return;
      this.init();
      this.playNextBGMNote();
    }

    playNextBGMNote() {
      if (this.muted) {
        this.bgmTimer = setTimeout(() => this.playNextBGMNote(), 300);
        return;
      }
      this.init();
      const melody = this.isBossBGM ? this.bossMelody : this.normalMelody;
      const item = melody[this.bgmIndex % melody.length];
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      const now = this.ctx.currentTime;
      
      osc.type = this.isBossBGM ? 'sawtooth' : 'triangle';
      osc.frequency.setValueAtTime(item.note, now);
      
      gain.gain.setValueAtTime(0, now);
      gain.gain.linearRampToValueAtTime(this.isBossBGM ? 0.06 : 0.04, now + 0.01);
      gain.gain.linearRampToValueAtTime(0.005, now + item.duration * 0.9);
      
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start(now);
      osc.stop(now + item.duration * 0.9);
      
      this.bgmIndex = (this.bgmIndex + 1) % melody.length;
      this.bgmTimer = setTimeout(() => this.playNextBGMNote(), item.duration * 1000);
    }
  }

  const audio = new CuteAudioEngine();
  const audioBtn = document.getElementById('audioToggle');
  audioBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    audio.muted = !audio.muted;
    audioBtn.textContent = audio.muted ? '🔇 음소거 중' : '🔊 소리 켬';
  });

  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');

  let score = 0;
  let fishesCollected = 0;
  let highScore = localStorage.getItem('cat_high_score') || 0;
  let gameOver = false;
  let gameStarted = false;
  let frame = 0;

  let loopCount = 1;
  let stageCount = 1;
  let stageFrameTimer = 0;
  const STAGE_DURATION = 90 * 60; // 스테이지 전체 길이
  const BOSS_SPAWN_FRAME = 60 * 60; // 1분 = 60초 = 3600 프레임 후 보스 출현
  let bossActive = false;
  let bossDefeated = false;

  let hp = 3;
  let maxHp = 3;
  let invincibleTimer = 0;
  let hasShield = false;
  let feverGauge = 0;
  let isFever = false;
  let feverTimer = 0;
  let comboCount = 0;
  let comboTimer = 0;
  let magnetTimer = 0;
  let catnipTimer = 0;
  let sprayTimer = 0;

  const stageThemes = [
    { name: '거실', sky1: '#fef3c7', sky2: '#fde68a', ground: '#78350f' },
    { name: '골목길', sky1: '#ff8c00', sky2: '#e65100', ground: '#424242' },
    { name: '공원', sky1: '#4a148c', sky2: '#7b1fa2', ground: '#1b5e20' },
    { name: '옥상 기지', sky1: '#0d47a1', sky2: '#1a237e', ground: '#212121' }
  ];

  const cat = {
    x: 70,
    y: 208,
    width: 48,
    height: 34,
    dy: 0,
    gravity: 0.65,
    jumpPower: -11.2,
    isGrounded: true,
    jumpCount: 0,
    maxJumps: 2,
    legFrame: 0,

    draw() {
      ctx.save();
      if (invincibleTimer > 0 && Math.floor(frame / 4) % 2 === 0) {
        ctx.globalAlpha = 0.5;
      }

      const drawScale = isFever ? 1.6 : 1.0;
      const curWidth = this.width * drawScale;
      const curHeight = this.height * drawScale;
      const curY = this.y - (curHeight - this.height);

      ctx.fillStyle = 'rgba(0,0,0,0.15)';
      ctx.beginPath();
      ctx.ellipse(this.x + 22 * drawScale, 242, 20 * drawScale, 5 * drawScale, 0, 0, Math.PI * 2);
      ctx.fill();

      if (isFever) {
        ctx.fillStyle = `hsl(${(frame * 10) % 360}, 100%, 70%)`;
        ctx.beginPath();
        ctx.arc(this.x + curWidth/2, curY + curHeight/2, curWidth * 0.7, 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.fillStyle = '#7a5e4b';
      ctx.fillRect(this.x + 4 * drawScale, curY + 8 * drawScale, 36 * drawScale, 22 * drawScale);
      ctx.fillStyle = '#3d2e24';
      ctx.fillRect(this.x + 12 * drawScale, curY + 10 * drawScale, 4 * drawScale, 16 * drawScale);
      ctx.fillRect(this.x + 20 * drawScale, curY + 10 * drawScale, 4 * drawScale, 16 * drawScale);
      ctx.fillRect(this.x + 28 * drawScale, curY + 10 * drawScale, 4 * drawScale, 16 * drawScale);
      ctx.fillRect(this.x + 28 * drawScale, curY - 6 * drawScale, 20 * drawScale, 20 * drawScale);

      ctx.fillStyle = '#9e806c';
      ctx.fillRect(this.x + 38 * drawScale, curY + 6 * drawScale, 10 * drawScale, 8 * drawScale);
      ctx.fillStyle = '#3d2e24';
      ctx.fillRect(this.x + 30 * drawScale, curY - 14 * drawScale, 6 * drawScale, 8 * drawScale);
      ctx.fillRect(this.x + 40 * drawScale, curY - 14 * drawScale, 6 * drawScale, 8 * drawScale);
      ctx.fillStyle = '#10b981';
      ctx.fillRect(this.x + 40 * drawScale, curY, 5 * drawScale, 5 * drawScale);

      ctx.fillStyle = '#3d2e24';
      const tailAnim = Math.sin(frame * 0.25) * 5;
      ctx.fillRect(this.x - 8 * drawScale, curY + 6 * drawScale + tailAnim, 12 * drawScale, 5 * drawScale);

      if (this.isGrounded) {
        this.legFrame = (this.legFrame + 0.3) % 4;
        const offset = Math.sin(this.legFrame) * 4;
        ctx.fillRect(this.x + 8 * drawScale + offset, curY + 30 * drawScale, 6 * drawScale, 6 * drawScale);
        ctx.fillRect(this.x + 28 * drawScale - offset, curY + 30 * drawScale, 6 * drawScale, 6 * drawScale);
      } else {
        ctx.fillRect(this.x + 4 * drawScale, curY + 28 * drawScale, 8 * drawScale, 5 * drawScale);
        ctx.fillRect(this.x + 32 * drawScale, curY + 28 * drawScale, 8 * drawScale, 5 * drawScale);
      }

      if (hasShield) {
        ctx.strokeStyle = '#38bdf8';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(this.x + curWidth/2, curY + curHeight/2, curWidth * 0.65, 0, Math.PI * 2);
        ctx.stroke();
      }
      ctx.restore();
    },

    jump() {
      if (this.jumpCount < this.maxJumps) {
        const curPower = catnipTimer > 0 ? this.jumpPower * 1.15 : this.jumpPower;
        this.dy = curPower;
        this.isGrounded = false;
        this.jumpCount++;
        audio.playJump(this.jumpCount === 2);
      }
    },

    update() {
      const curGravity = catnipTimer > 0 ? 0.35 : this.gravity;
      this.dy += curGravity;
      this.y += this.dy;

      if (this.y >= 208) {
        this.y = 208;
        this.dy = 0;
        this.isGrounded = true;
        this.jumpCount = 0;
      }
      this.draw();
    }
  };

  const obstacles = [];
  const fishes = [];
  const items = [];
  const floatingTexts = [];
  let obstacleTimer = 0;
  let fishTimer = 0;
  let itemTimer = 0;

  function getCurrentSpeed() {
    const stageProgress = stageFrameTimer / STAGE_DURATION;
    const baseSpeed = 4.8 + (loopCount - 1) * 0.4 + (stageCount - 1) * 0.3 + stageProgress * 0.6;
    return Math.min(baseSpeed, 8.0);
  }

  function createObstacle() {
    const types = ['ball', 'box', 'tall_box'];
    const type = types[Math.floor(Math.random() * types.length)];
    let h = 26;
    let y = 216;
    if (type === 'tall_box') { h = 44; y = 198; }

    obstacles.push({
      x: canvas.width,
      y: y,
      width: 24,
      height: h,
      type: type,
      speed: getCurrentSpeed()
    });
  }

  function createFish() {
    fishes.push({
      x: canvas.width,
      y: 130 + Math.random() * 50,
      width: 20,
      height: 14,
      speed: getCurrentSpeed() - 0.5,
      bob: Math.random() * 10
    });
  }

  function createSpecialItem() {
    const itemTypes = ['shield', 'catnip', 'magnet', 'spray'];
    const type = itemTypes[Math.floor(Math.random() * itemTypes.length)];
    items.push({
      x: canvas.width,
      y: 120 + Math.random() * 60,
      width: 24,
      height: 24,
      type: type,
      speed: getCurrentSpeed() - 1.0
    });
  }

  function handleInput() {
    audio.startBGM();
    if (!gameStarted) {
      gameStarted = true;
      restartGame();
      return;
    }
    if (gameOver) {
      restartGame();
    } else {
      cat.jump();
    }
  }

  window.addEventListener('keydown', (e) => {
    if (e.code === 'Space' || e.code === 'ArrowUp') {
      e.preventDefault();
      handleInput();
    }
  });

  canvas.addEventListener('touchstart', (e) => {
    e.preventDefault();
    handleInput();
  }, { passive: false });

  canvas.addEventListener('mousedown', (e) => {
    handleInput();
  });

  document.getElementById('jumpBtn').addEventListener('click', (e) => {
    handleInput();
  });

  const bossDefinitions = [
    { name: '터보', count: 12, color: '#3b82f6', throwInterval: 24 },
    { name: '누렁', count: 15, color: '#ec4899', throwInterval: 20 },
    { name: '유', count: 18, color: '#8b5cf6', throwInterval: 16 },
    { name: '아', count: 22, color: '#f59e0b', throwInterval: 12 }
  ];

  let currentBoss = null;
  const treats = [];

  function spawnStageBoss() {
    bossActive = true;
    bossDefeated = false;
    audio.setBossMode(true);
    
    const def = bossDefinitions[(stageCount - 1) % bossDefinitions.length];
    const types = ['can', 'churru', 'biscuit'];
    const snackPool = [];
    for (let i = 0; i < def.count + (loopCount - 1) * 3; i++) {
      snackPool.push(types[i % types.length]);
    }

    currentBoss = {
      ...def,
      x: canvas.width + 30,
      y: 160,
      targetX: canvas.width - 90,
      state: 'entering',
      timer: 0,
      thrownCount: 0,
      snackPool: snackPool
    };

    floatingTexts.push({
      x: canvas.width / 2,
      y: 100,
      text: `⚠️ 보스 ${def.name} 등장! (1분 경과) ⚠️`,
      alpha: 1.0,
      vy: -0.5,
      color: '#ef4444'
    });
  }

  function updateBoss() {
    if (!currentBoss) return;
    const b = currentBoss;

    if (b.state === 'entering') {
      b.x -= 3;
      if (b.x <= b.targetX) b.state = 'throwing';
    } else if (b.state === 'throwing') {
      b.timer++;
      if (b.timer % b.throwInterval === 0 && b.thrownCount < b.snackPool.length) {
        audio.playSnackThrow();
        const type = b.snackPool[b.thrownCount];
        let pts = type === 'can' ? 300 : (type === 'churru' ? 250 : 200);

        treats.push({
          x: b.x,
          y: b.y + 10,
          vx: -(3 + Math.random() * 4 + (loopCount * 0.3)),
          vy: -(4 + Math.random() * 4),
          gravity: 0.25,
          width: 20,
          height: 18,
          type: type,
          points: pts
        });
        b.thrownCount++;
      }
      if (b.thrownCount >= b.snackPool.length && b.timer > b.snackPool.length * b.throwInterval + 30) {
        b.state = 'leaving';
      }
    } else if (b.state === 'leaving') {
      b.x += 4;
      if (b.x > canvas.width + 50) {
        currentBoss = null;
        bossActive = false;
        bossDefeated = true;
        audio.setBossMode(false);

        floatingTexts.push({
          x: canvas.width / 2,
          y: 100,
          text: `🎉 STAGE ${loopCount}-${stageCount} CLEAR!`,
          alpha: 1.0,
          vy: -0.5,
          color: '#10b981'
        });

        setTimeout(() => {
          advanceNextStage();
        }, 1500);
      }
    }

    if (currentBoss) {
      ctx.save();
      ctx.fillStyle = b.color;
      ctx.fillRect(b.x + 6, b.y + 24, 20, 28);
      ctx.fillStyle = '#fde047';
      ctx.fillRect(b.x + 8, b.y + 6, 16, 18);
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 13px Courier New';
      ctx.textAlign = 'center';
      ctx.fillText(b.name, b.x + 16, b.y - 6);
      ctx.restore();
    }
  }

  function advanceNextStage() {
    stageCount++;
    if (stageCount > 4) {
      stageCount = 1;
      loopCount++;
    }
    stageFrameTimer = 0;
    bossActive = false;
    bossDefeated = false;
  }

  function restartGame() {
    loopCount = 1;
    stageCount = 1;
    stageFrameTimer = 0;
    bossActive = false;
    bossDefeated = false;
    currentBoss = null;
    audio.setBossMode(false);

    treats.length = 0;
    obstacles.length = 0;
    fishes.length = 0;
    items.length = 0;
    floatingTexts.length = 0;

    cat.y = 208;
    cat.dy = 0;
    score = 0;
    fishesCollected = 0;
    hp = maxHp;
    invincibleTimer = 0;
    hasShield = false;
    feverGauge = 0;
    isFever = false;
    feverTimer = 0;
    comboCount = 0;
    comboTimer = 0;
    magnetTimer = 0;
    catnipTimer = 0;
    sprayTimer = 0;
    gameOver = false;
    obstacleTimer = 0;
    fishTimer = 0;
    itemTimer = 0;
  }

  function gameLoop() {
    frame++;
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    if (gameStarted && !gameOver) {
      stageFrameTimer++;
      if (stageFrameTimer >= BOSS_SPAWN_FRAME && !bossActive && !bossDefeated) {
        spawnStageBoss();
      }
    }

    if (invincibleTimer > 0) invincibleTimer--;
    if (comboTimer > 0) comboTimer--; else comboCount = 0;
    if (magnetTimer > 0) magnetTimer--;
    if (catnipTimer > 0) catnipTimer--;
    if (sprayTimer > 0) sprayTimer--;

    if (isFever) {
      feverTimer--;
      feverGauge = (feverTimer / 360) * 100;
      if (feverTimer <= 0) { isFever = false; feverGauge = 0; }
    }

    const theme = stageThemes[(stageCount - 1) % stageThemes.length];
    const skyGradient = ctx.createLinearGradient(0, 0, 0, 240);
    if (isFever) {
      skyGradient.addColorStop(0, '#f43f5e');
      skyGradient.addColorStop(1, '#3b82f6');
    } else {
      skyGradient.addColorStop(0, theme.sky1);
      skyGradient.addColorStop(1, theme.sky2);
    }
    ctx.fillStyle = skyGradient;
    ctx.fillRect(0, 0, canvas.width, 240);

    ctx.fillStyle = theme.ground;
    ctx.fillRect(0, 240, canvas.width, 80);

    if (!gameStarted) {
      cat.draw();
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 22px Courier New';
      ctx.textAlign = 'center';
      ctx.fillText('🐱 터치/버튼으로 시작!', canvas.width / 2, 120);
      ctx.font = '14px Courier New';
      ctx.fillText(`최고 기록: ${highScore}점`, canvas.width / 2, 150);
      requestAnimationFrame(gameLoop);
      return;
    }

    if (!gameOver) {
      score++;
      if (score > highScore) {
        highScore = score;
        localStorage.setItem('cat_high_score', highScore);
      }
    }

    cat.update();
    updateBoss();

    itemTimer++;
    if (itemTimer > 300 + Math.random() * 200) {
      createSpecialItem();
      itemTimer = 0;
    }

    // 아이템 습득 및 아이템 아이콘 그리기
    for (let i = items.length - 1; i >= 0; i--) {
      const it = items[i];
      if (!gameOver) it.x -= it.speed;

      ctx.save();
      let itemBg = '#0ea5e9';
      let itemSymbol = '🛡️';
      if (it.type === 'catnip') { itemBg = '#10b981'; itemSymbol = '🌿'; }
      if (it.type === 'magnet') { itemBg = '#a855f7'; itemSymbol = '🧲'; }
      if (it.type === 'spray') { itemBg = '#f97316'; itemSymbol = '💦'; }

      ctx.fillStyle = itemBg;
      ctx.beginPath();
      ctx.arc(it.x + 12, it.y + 12, 12, 0, Math.PI * 2);
      ctx.fill();

      ctx.font = '12px Segoe UI Emoji, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(itemSymbol, it.x + 12, it.y + 16);
      ctx.restore();

      if (cat.x < it.x + it.width && cat.x + cat.width > it.x && cat.y < it.y + it.height && cat.y + cat.height > it.y) {
        audio.playCrunchSound();
        if (it.type === 'shield') {
          hasShield = true;
          floatingTexts.push({ x: it.x, y: it.y, text: '🛡️ 방어막! (충돌 1회 방어)', alpha: 1.0, vy: -1.5, color: '#38bdf8' });
        } else if (it.type === 'catnip') {
          catnipTimer = 360;
          floatingTexts.push({ x: it.x, y: it.y, text: '🌿 캣잎! (저중력 높은점프)', alpha: 1.0, vy: -1.5, color: '#34d399' });
        } else if (it.type === 'magnet') {
          magnetTimer = 360;
          floatingTexts.push({ x: it.x, y: it.y, text: '🧲 자석! (간식 자동흡수)', alpha: 1.0, vy: -1.5, color: '#c084fc' });
        } else if (it.type === 'spray') {
          sprayTimer = 180;
          floatingTexts.push({ x: it.x, y: it.y, text: '💦 물뿌리개! (시야 방해)', alpha: 1.0, vy: -1.5, color: '#f97316' });
        }
        items.splice(i, 1);
      }
    }

    for (let i = treats.length - 1; i >= 0; i--) {
      const t = treats[i];
      if (!gameOver) {
        if (magnetTimer > 0) {
          const dx = (cat.x + cat.width/2) - (t.x + t.width/2);
          const dy = (cat.y + cat.height/2) - (t.y + t.height/2);
          const dist = Math.sqrt(dx*dx + dy*dy);
          if (dist < 200) { t.x += (dx / dist) * 7; t.y += (dy / dist) * 7; }
        }
        t.x += t.vx;
        t.y += t.vy;
        t.vy += t.gravity;
        if (t.y >= 222) { t.y = 222; t.vy = 0; t.vx = -3; }
      }

      ctx.fillStyle = t.type === 'can' ? '#0284c7' : (t.type === 'churru' ? '#f43f5e' : '#d97706');
      ctx.fillRect(t.x, t.y, t.width, t.height);

      if (cat.x < t.x + t.width && cat.x + cat.width > t.x && cat.y < t.y + t.height && cat.y + cat.height > t.y) {
        audio.playCanSound();
        score += (t.points || 200);
        fishesCollected++;
        treats.splice(i, 1);
        continue;
      }
      if (t.x + t.width < 0) treats.splice(i, 1);
    }

    const obstacleSpawnInterval = Math.max(32, 60 - (loopCount * 4) - (stageCount * 2));
    obstacleTimer++;
    if (obstacleTimer > obstacleSpawnInterval + Math.random() * 25) {
      createObstacle();
      obstacleTimer = 0;
    }

    fishTimer++;
    if (fishTimer > 120 + Math.random() * 60) {
      createFish();
      fishTimer = 0;
    }

    for (let i = fishes.length - 1; i >= 0; i--) {
      const f = fishes[i];
      if (!gameOver) f.x -= f.speed;
      const floatY = f.y + Math.sin(frame * 0.1 + f.bob) * 4;
      ctx.fillStyle = '#f97316';
      ctx.fillRect(f.x, floatY, 14, 10);

      if (cat.x < f.x + f.width && cat.x + cat.width > f.x && cat.y < floatY + f.height && cat.y + cat.height > floatY) {
        audio.playCrunchSound();
        score += 150;
        fishesCollected++;
        fishes.splice(i, 1);
        continue;
      }
      if (f.x + f.width < 0) fishes.splice(i, 1);
    }

    for (let i = obstacles.length - 1; i >= 0; i--) {
      const obs = obstacles[i];
      if (!gameOver) obs.x -= obs.speed;

      ctx.fillStyle = obs.type === 'ball' ? '#ef4444' : '#b45309';
      ctx.fillRect(obs.x, obs.y, obs.width, obs.height);

      if (cat.x + 6 < obs.x + obs.width && cat.x + cat.width - 6 > obs.x && cat.y + 6 < obs.y + obs.height && cat.y + cat.height > obs.y) {
        if (isFever) {
          audio.playCrunchSound();
          score += 500;
          obstacles.splice(i, 1);
          continue;
        }

        if (invincibleTimer <= 0) {
          if (hasShield) {
            hasShield = false;
            invincibleTimer = 45;
            audio.playHitSound();
            floatingTexts.push({ x: cat.x, y: cat.y, text: '🛡️ 방어막 파괴!', alpha: 1.0, vy: -1.5, color: '#38bdf8' });
          } else {
            hp--;
            invincibleTimer = 60;
            audio.playHitSound();
            if (hp <= 0 && !gameOver) {
              gameOver = true;
              audio.playGameOver();
            }
          }
        }
      }
      if (obs.x + obs.width < 0) obstacles.splice(i, 1);
    }

    // 디버프(물뿌리개) 시야 가림 연출
    if (sprayTimer > 0) {
      ctx.save();
      ctx.fillStyle = 'rgba(56, 189, 248, 0.45)';
      ctx.beginPath();
      ctx.arc(160, 90, 75, 0, Math.PI * 2);
      ctx.arc(440, 170, 95, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    for (let i = floatingTexts.length - 1; i >= 0; i--) {
      const ft = floatingTexts[i];
      if (!gameOver) { ft.y += ft.vy; ft.alpha -= 0.02; }
      ctx.save();
      ctx.globalAlpha = Math.max(0, ft.alpha);
      ctx.fillStyle = ft.color || '#fde047';
      ctx.font = 'bold 15px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(ft.text, ft.x, ft.y);
      ctx.restore();
      if (ft.alpha <= 0) floatingTexts.splice(i, 1);
    }

    // 상단 HUD UI 정보
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 14px sans-serif';
    ctx.textAlign = 'left';
    ctx.fillText(`STAGE ${loopCount}-${stageCount} (${theme.name})`, 15, 25);
    ctx.fillText(`SCORE: ${score}`, 210, 25);

    let heartsText = '';
    for (let h = 0; h < maxHp; h++) heartsText += h < hp ? '❤️' : '🖤';
    ctx.fillText(heartsText, canvas.width - 85, 25);

    // 활성화된 아이템 버프/디버프 상태 실시간 표시
    ctx.font = 'bold 12px sans-serif';
    let statusX = 15;
    if (hasShield) {
      ctx.fillStyle = '#38bdf8';
      ctx.fillText('🛡️방어막', statusX, 48);
      statusX += 65;
    }
    if (catnipTimer > 0) {
      ctx.fillStyle = '#34d399';
      ctx.fillText(`🌿점프UP(${Math.ceil(catnipTimer/60)}s)`, statusX, 48);
      statusX += 95;
    }
    if (magnetTimer > 0) {
      ctx.fillStyle = '#c084fc';
      ctx.fillText(`🧲자석(${Math.ceil(magnetTimer/60)}s)`, statusX, 48);
      statusX += 80;
    }
    if (sprayTimer > 0) {
      ctx.fillStyle = '#f97316';
      ctx.fillText(`💦시야방해(${Math.ceil(sprayTimer/60)}s)`, statusX, 48);
    }

    if (gameOver) {
      ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#ffffff';
      ctx.textAlign = 'center';
      ctx.font = 'bold 26px Courier New';
      ctx.fillText('GAME OVER', canvas.width / 2, 110);
      ctx.font = '16px Courier New';
      ctx.fillStyle = '#fde047';
      ctx.fillText(`최종 기록: Stage ${loopCount}-${stageCount} (${score}점)`, canvas.width / 2, 150);
      ctx.fillStyle = '#ffffff';
      ctx.font = '14px Courier New';
      ctx.fillText('화면을 터치하여 다시 시작', canvas.width / 2, 190);
    }

    requestAnimationFrame(gameLoop);
  }

  gameLoop();
</script>

</body>
