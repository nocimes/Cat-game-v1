<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>우동이 간식탐험 Deluxe</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }
    body {
      background-color: #1a1a24;
      color: #fff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    #game-container {
      position: relative;
      width: 100%;
      max-width: 600px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .header {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 15px;
      box-sizing: border-box;
    }
    h1 {
      margin: 0;
      font-size: 18px;
      color: #ffd166;
      text-shadow: 2px 2px #000;
    }
    .audio-btn {
      background: #444;
      border: 2px solid #666;
      color: #fff;
      border-radius: 20px;
      padding: 5px 12px;
      font-size: 12px;
      cursor: pointer;
    }
    canvas {
      width: 100%;
      height: auto;
      background-color: #fdf6e3;
      border: 4px solid #4a3b32;
      border-radius: 8px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }
    .controls-hint {
      margin-top: 10px;
      font-size: 13px;
      color: #aaa;
      text-align: center;
    }
    .touch-jump-btn {
      margin-top: 15px;
      width: 90%;
      padding: 15px;
      background: linear-gradient(180deg, #ff9f43, #ee5253);
      color: white;
      font-size: 20px;
      font-weight: bold;
      border: none;
      border-radius: 12px;
      box-shadow: 0 5px 0 #b12829;
      cursor: pointer;
      display: block;
    }
    .touch-jump-btn:active {
      transform: translateY(4px);
      box-shadow: 0 1px 0 #b12829;
    }
  </style>
</head>
<body>

<div id="game-container">
  <div class="header">
    <h1>🐱 우동이 간식탐험 Deluxe</h1>
    <button class="audio-btn" id="audioToggle">🔊 음소거</button>
  </div>
  <canvas id="gameCanvas" width="600" height="320"></canvas>
  <button class="touch-jump-btn" id="jumpBtn">🦘 점프! (터치)</button>
  <div class="controls-hint">🐱 체력 3개 / 피버 모드 / 특수 아이템 추가됨!</div>
</div>

<script>
  class CuteAudioEngine {
    constructor() {
      this.ctx = null;
      this.muted = false;
      this.bgmTimer = null;
      this.bgmIndex = 0;
      this.melody = [
        { note: 523.25, duration: 0.2 },
        { note: 659.25, duration: 0.2 },
        { note: 783.99, duration: 0.2 },
        { note: 880.00, duration: 0.2 },
        { note: 1046.50, duration: 0.4 },
        { note: 880.00, duration: 0.2 },
        { note: 783.99, duration: 0.4 },
        { note: 659.25, duration: 0.2 },
        { note: 587.33, duration: 0.2 },
        { note: 523.25, duration: 0.4 },
      ];
    }

    init() {
      if (!this.ctx) {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        this.ctx = new AudioCtx();
      }
      if (this.ctx.state === 'suspended') {
        this.ctx.resume();
      }
    }

    playJump(isDouble = false) {
      if (this.muted) return;
      this.init();
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      const startFreq = isDouble ? 500 : 300;
      const endFreq = isDouble ? 1100 : 800;
      osc.type = 'square';
      osc.frequency.setValueAtTime(startFreq, this.ctx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(endFreq, this.ctx.currentTime + 0.12);
      gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
      gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.12);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start();
      osc.stop(this.ctx.currentTime + 0.12);
    }

    playCanSound() {
      if (this.muted) return;
      this.init();
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(1400, this.ctx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(350, this.ctx.currentTime + 0.04);
      gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
      gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.04);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start();
      osc.stop(this.ctx.currentTime + 0.04);
    }

    playChurruSound() {
      if (this.muted) return;
      this.init();
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(450, this.ctx.currentTime);
      osc.frequency.linearRampToValueAtTime(900, this.ctx.currentTime + 0.08);
      gain.gain.setValueAtTime(0.25, this.ctx.currentTime);
      gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.18);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start();
      osc.stop(this.ctx.currentTime + 0.18);
    }

    playCrunchSound() {
      if (this.muted) return;
      this.init();
      const bufferSize = this.ctx.sampleRate * 0.07;
      const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) {
        data[i] = (Math.random() * 2 - 1) * (i % 60 < 30 ? 1 : 0.3);
      }
      const noise = this.ctx.createBufferSource();
      noise.buffer = buffer;
      const gain = this.ctx.createGain();
      gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.07);
      noise.connect(gain);
      gain.connect(this.ctx.destination);
      noise.start();
    }

    playFeverSound() {
      if (this.muted) return;
      this.init();
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(400, this.ctx.currentTime);
      osc.frequency.linearRampToValueAtTime(1200, this.ctx.currentTime + 0.3);
      gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
      gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.3);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start();
      osc.stop(this.ctx.currentTime + 0.3);
    }

    playHitSound() {
      if (this.muted) return;
      this.init();
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'square';
      osc.frequency.setValueAtTime(180, this.ctx.currentTime);
      osc.frequency.linearRampToValueAtTime(60, this.ctx.currentTime + 0.2);
      gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
      gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.2);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start();
      osc.stop(this.ctx.currentTime + 0.2);
    }

    playGameOver() {
      if (this.muted) return;
      this.init();
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(400, this.ctx.currentTime);
      osc.frequency.linearRampToValueAtTime(120, this.ctx.currentTime + 0.4);
      gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
      gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.4);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start();
      osc.stop(this.ctx.currentTime + 0.4);
    }

    startBGM() {
      if (this.bgmTimer) return;
      this.init();
      this.playNextBGMNote();
    }

    playNextBGMNote() {
      if (this.muted) {
        this.bgmTimer = setTimeout(() => this.playNextBGMNote(), 300);
        return;
      }
      this.init();
      const item = this.melody[this.bgmIndex];
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(item.note, this.ctx.currentTime);
      gain.gain.setValueAtTime(0.05, this.ctx.currentTime);
      gain.gain.linearRampToValueAtTime(0.005, this.ctx.currentTime + item.duration * 0.9);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start();
      osc.stop(this.ctx.currentTime + item.duration * 0.9);
      this.bgmIndex = (this.bgmIndex + 1) % this.melody.length;
      this.bgmTimer = setTimeout(() => this.playNextBGMNote(), item.duration * 1000);
    }
  }

  const audio = new CuteAudioEngine();
  const audioBtn = document.getElementById('audioToggle');
  audioBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    audio.muted = !audio.muted;
    audioBtn.textContent = audio.muted ? '🔇 음소거 중' : '🔊 소리 켬';
  });

  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');

  let score = 0;
  let fishesCollected = 0;
  let highScore = localStorage.getItem('cat_high_score') || 0;
  let gameOver = false;
  let gameStarted = false;
  let frame = 0;

  let hp = 3;
  let maxHp = 3;
  let invincibleTimer = 0;
  let hasShield = false;
  let feverGauge = 0;
  let isFever = false;
  let feverTimer = 0;
  let comboCount = 0;
  let comboTimer = 0;
  let magnetTimer = 0;
  let catnipTimer = 0;
  let sprayTimer = 0;

  const cat = {
    x: 70,
    y: 208,
    width: 48,
    height: 34,
    dy: 0,
    gravity: 0.65,
    jumpPower: -11.2,
    isGrounded: true,
    jumpCount: 0,
    maxJumps: 2,
    legFrame: 0,

    draw() {
      ctx.save();
      
      if (invincibleTimer > 0 && Math.floor(frame / 4) % 2 === 0) {
        ctx.globalAlpha = 0.5;
      }

      const drawScale = isFever ? 1.6 : 1.0;
      const curWidth = this.width * drawScale;
      const curHeight = this.height * drawScale;
      const curY = this.y - (curHeight - this.height);

      ctx.fillStyle = 'rgba(0,0,0,0.15)';
      ctx.beginPath();
      ctx.ellipse(this.x + 22 * drawScale, 242, 20 * drawScale, 5 * drawScale, 0, 0, Math.PI * 2);
      ctx.fill();

      if (isFever) {
        ctx.fillStyle = `hsl(${(frame * 10) % 360}, 100%, 70%)`;
        ctx.beginPath();
        ctx.arc(this.x + curWidth/2, curY + curHeight/2, curWidth * 0.7, 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.fillStyle = '#7a5e4b';
      ctx.fillRect(this.x + 4 * drawScale, curY + 8 * drawScale, 36 * drawScale, 22 * drawScale);

      ctx.fillStyle = '#3d2e24';
      ctx.fillRect(this.x + 12 * drawScale, curY + 10 * drawScale, 4 * drawScale, 16 * drawScale);
      ctx.fillRect(this.x + 20 * drawScale, curY + 10 * drawScale, 4 * drawScale, 16 * drawScale);
      ctx.fillRect(this.x + 28 * drawScale, curY + 10 * drawScale, 4 * drawScale, 16 * drawScale);

      ctx.fillStyle = '#7a5e4b';
      ctx.fillRect(this.x + 28 * drawScale, curY - 6 * drawScale, 20 * drawScale, 20 * drawScale);

      ctx.fillStyle = '#9e806c';
      ctx.fillRect(this.x + 38 * drawScale, curY + 6 * drawScale, 10 * drawScale, 8 * drawScale);

      ctx.fillStyle = '#3d2e24';
      ctx.fillRect(this.x + 30 * drawScale, curY - 14 * drawScale, 6 * drawScale, 8 * drawScale);
      ctx.fillRect(this.x + 40 * drawScale, curY - 14 * drawScale, 6 * drawScale, 8 * drawScale);

      ctx.fillStyle = '#10b981';
      ctx.fillRect(this.x + 40 * drawScale, curY, 5 * drawScale, 5 * drawScale);

      ctx.fillStyle = '#3d2e24';
      const tailAnim = Math.sin(frame * 0.25) * 5;
      ctx.fillRect(this.x - 8 * drawScale, curY + 6 * drawScale + tailAnim, 12 * drawScale, 5 * drawScale);

      ctx.fillStyle = '#3d2e24';
      if (this.isGrounded) {
        this.legFrame = (this.legFrame + 0.3) % 4;
        const offset = Math.sin(this.legFrame) * 4;
        ctx.fillRect(this.x + 8 * drawScale + offset, curY + 30 * drawScale, 6 * drawScale, 6 * drawScale);
        ctx.fillRect(this.x + 28 * drawScale - offset, curY + 30 * drawScale, 6 * drawScale, 6 * drawScale);
      } else {
        ctx.fillRect(this.x + 4 * drawScale, curY + 28 * drawScale, 8 * drawScale, 5 * drawScale);
        ctx.fillRect(this.x + 32 * drawScale, curY + 28 * drawScale, 8 * drawScale, 5 * drawScale);
      }

      if (hasShield) {
        ctx.strokeStyle = '#38bdf8';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(this.x + curWidth/2, curY + curHeight/2, curWidth * 0.65, 0, Math.PI * 2);
        ctx.stroke();
      }

      ctx.restore();
    },

    jump() {
      if (this.jumpCount < this.maxJumps) {
        const curPower = catnipTimer > 0 ? this.jumpPower * 1.15 : this.jumpPower;
        this.dy = curPower;
        this.isGrounded = false;
        this.jumpCount++;
        audio.playJump(this.jumpCount === 2);
      }
    },

    update() {
      const curGravity = catnipTimer > 0 ? 0.35 : this.gravity;
      this.dy += curGravity;
      this.y += this.dy;

      if (this.y >= 208) {
        this.y = 208;
        this.dy = 0;
        this.isGrounded = true;
        this.jumpCount = 0;
      }
      this.draw();
    }
  };

  const obstacles = [];
  const fishes = [];
  const items = [];
  const floatingTexts = [];
  let obstacleTimer = 0;
  let fishTimer = 0;
  let itemTimer = 0;

  function createObstacle() {
    const types = ['ball', 'box', 'tall_box'];
    const type = types[Math.floor(Math.random() * types.length)];
    let h = 26;
    let y = 216;

    if (type === 'tall_box') {
      h = 44;
      y = 198;
    }

    obstacles.push({
      x: canvas.width,
      y: y,
      width: 24,
      height: h,
      type: type,
      speed: 5.5 + Math.floor(score / 180) * 0.6
    });
  }

  function createFish() {
    fishes.push({
      x: canvas.width,
      y: 130 + Math.random() * 50,
      width: 20,
      height: 14,
      speed: 4.8 + Math.floor(score / 200) * 0.5,
      bob: Math.random() * 10
    });
  }

  function createSpecialItem() {
    const itemTypes = ['shield', 'catnip', 'magnet', 'spray'];
    const type = itemTypes[Math.floor(Math.random() * itemTypes.length)];
    items.push({
      x: canvas.width,
      y: 120 + Math.random() * 60,
      width: 22,
      height: 22,
      type: type,
      speed: 4.0
    });
  }

  function handleInput() {
    audio.startBGM();
    if (!gameStarted) {
      gameStarted = true;
      restartGame();
      return;
    }
    if (gameOver) {
      restartGame();
    } else {
      cat.jump();
    }
  }

  window.addEventListener('keydown', (e) => {
    if (e.code === 'Space' || e.code === 'ArrowUp') {
      e.preventDefault();
      handleInput();
    }
  });

  canvas.addEventListener('touchstart', (e) => {
    e.preventDefault();
    handleInput();
  }, { passive: false });

  canvas.addEventListener('mousedown', (e) => {
    handleInput();
  });

  document.getElementById('jumpBtn').addEventListener('click', (e) => {
    handleInput();
  });

  const humanTypes = [
    { name: '터보', count: 10, color: '#3b82f6', hairColor: '#27272a', hairStyle: 'short', glasses: true },
    { name: '누렁', count: 8, color: '#ec4899', hairColor: '#451a03', hairStyle: 'long', glasses: false },
    { name: '유', count: 5, color: '#8b5cf6', hairColor: '#18181b', hairStyle: 'long_girl', glasses: false },
    { name: '아', count: 5, color: '#f59e0b', hairColor: '#525252', hairStyle: 'braids', glasses: false }
  ];

  let activeHuman = null;
  let nextHumanScore = 3000;
  const treats = [];

  function spawnHuman() {
    if (activeHuman || !gameStarted || gameOver) return;
    const type = humanTypes[Math.floor(Math.random() * humanTypes.length)];
    const types = ['can', 'churru', 'biscuit'];
    const snackPool = [];
    for (let i = 0; i < type.count; i++) {
      snackPool.push(types[i % types.length]);
    }
    for (let i = snackPool.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [snackPool[i], snackPool[j]] = [snackPool[j], snackPool[i]];
    }

    activeHuman = {
      ...type,
      x: canvas.width + 30,
      y: 160,
      targetX: canvas.width - 90,
      state: 'entering',
      timer: 0,
      thrownCount: 0,
      snackPool: snackPool
    };
  }

  function drawHuman(h) {
    ctx.save();
    ctx.fillStyle = h.color;
    ctx.fillRect(h.x + 6, h.y + 24, 20, 28);
    ctx.fillStyle = '#fde047';
    ctx.fillRect(h.x + 8, h.y + 6, 16, 18);

    ctx.fillStyle = h.hairColor;
    if (h.hairStyle === 'short') {
      ctx.fillRect(h.x + 6, h.y + 2, 20, 8);
    } else if (h.hairStyle === 'long') {
      ctx.fillRect(h.x + 6, h.y + 2, 20, 10);
      ctx.fillRect(h.x + 4, h.y + 10, 6, 22);
      ctx.fillRect(h.x + 22, h.y + 10, 6, 22);
    } else if (h.hairStyle === 'long_girl') {
      ctx.fillRect(h.x + 6, h.y + 2, 20, 8);
      ctx.fillRect(h.x + 4, h.y + 8, 5, 26);
      ctx.fillRect(h.x + 23, h.y + 8, 5, 26);
    } else if (h.hairStyle === 'braids') {
      ctx.fillRect(h.x + 6, h.y + 2, 20, 8);
      ctx.fillRect(h.x + 2, h.y + 10, 5, 20);
      ctx.fillRect(h.x + 25, h.y + 10, 5, 20);
      ctx.fillStyle = '#ef4444';
      ctx.fillRect(h.x + 1, h.y + 22, 7, 3);
      ctx.fillRect(h.x + 24, h.y + 22, 7, 3);
    }

    ctx.fillStyle = h.glasses ? '#1e293b' : '#000000';
    ctx.fillRect(h.x + 11, h.y + 13, 3, 3);
    ctx.fillRect(h.x + 18, h.y + 13, 3, 3);

    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 13px Courier New';
    ctx.textAlign = 'center';
    ctx.fillText(h.name, h.x + 16, h.y - 6);
    ctx.restore();
  }

  function updateHuman() {
    if (!activeHuman) return;
    const h = activeHuman;

    if (h.state === 'entering') {
      h.x -= 3;
      if (h.x <= h.targetX) h.state = 'throwing';
    } else if (h.state === 'throwing') {
      h.timer++;
      if (h.timer % 12 === 0 && h.thrownCount < h.count) {
        const type = h.snackPool[h.thrownCount] || 'biscuit';
        let pts = 200, w = 20, hHeight = 18;

        if (type === 'can') { pts = 300; w = 20; hHeight = 18; }
        else if (type === 'churru') { pts = 250; w = 24; hHeight = 10; }
        else if (type === 'biscuit') { pts = 200; w = 20; hHeight = 14; }

        treats.push({
          x: h.x,
          y: h.y + 10,
          vx: -(3 + Math.random() * 4),
          vy: -(4 + Math.random() * 4),
          gravity: 0.25,
          width: w,
          height: hHeight,
          type: type,
          points: pts
        });
        h.thrownCount++;
      }
      if (h.thrownCount >= h.count && h.timer > h.count * 12 + 20) {
        h.state = 'leaving';
      }
    } else if (h.state === 'leaving') {
      h.x += 4;
      if (h.x > canvas.width + 50) activeHuman = null;
    }
    drawHuman(h);
  }

  function addScoreAndCombo(pts, color, x, y) {
    comboCount++;
    comboTimer = 120;
    const comboBonus = Math.floor(pts * (1 + comboCount * 0.1));
    score += comboBonus;

    if (!isFever) {
      feverGauge += 12;
      if (feverGauge >= 100) {
        feverGauge = 100;
        isFever = true;
        feverTimer = 360;
        audio.playFeverSound();
        floatingTexts.push({
          x: canvas.width / 2,
          y: 100,
          text: '🔥 FEVER TIME! 🔥',
          alpha: 1.0,
          vy: -1,
          color: '#ef4444'
        });
      }
    }

    floatingTexts.push({
      x: x,
      y: y,
      text: comboCount > 1 ? `+${comboBonus} (${comboCount}COMBO)` : `+${pts}`,
      alpha: 1.0,
      vy: -1.5,
      color: color
    });
  }

  function restartGame() {
    activeHuman = null;
    nextHumanScore = 3000;
    treats.length = 0;
    obstacles.length = 0;
    fishes.length = 0;
    items.length = 0;
    floatingTexts.length = 0;
    cat.y = 208;
    cat.dy = 0;
    score = 0;
    fishesCollected = 0;
    hp = maxHp;
    invincibleTimer = 0;
    hasShield = false;
    feverGauge = 0;
    isFever = false;
    feverTimer = 0;
    comboCount = 0;
    comboTimer = 0;
    magnetTimer = 0;
    catnipTimer = 0;
    sprayTimer = 0;
    gameOver = false;
    obstacleTimer = 0;
    fishTimer = 0;
    itemTimer = 0;
  }

  function gameLoop() {
    frame++;
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    if (invincibleTimer > 0) invincibleTimer--;
    if (comboTimer > 0) comboTimer--; else comboCount = 0;
    if (magnetTimer > 0) magnetTimer--;
    if (catnipTimer > 0) catnipTimer--;
    if (sprayTimer > 0) sprayTimer--;

    if (isFever) {
      feverTimer--;
      feverGauge = (feverTimer / 360) * 100;
      if (feverTimer <= 0) {
        isFever = false;
        feverGauge = 0;
      }
    }

    const skyGradient = ctx.createLinearGradient(0, 0, 0, 240);
    if (isFever) {
      skyGradient.addColorStop(0, '#f43f5e');
      skyGradient.addColorStop(0.5, '#fbbf24');
      skyGradient.addColorStop(1, '#3b82f6');
    } else {
      skyGradient.addColorStop(0, '#fef3c7');
      skyGradient.addColorStop(1, '#fde68a');
    }
    ctx.fillStyle = skyGradient;
    ctx.fillRect(0, 0, canvas.width, 240);

    ctx.fillStyle = '#78350f';
    ctx.fillRect(0, 240, canvas.width, 80);
    ctx.fillStyle = '#a16207';
    ctx.fillRect(0, 240, canvas.width, 6);

    ctx.fillStyle = '#92400e';
    for (let i = 0; i < canvas.width; i += 30) {
      const offsetX = (i - (frame * 2)) % canvas.width;
      const posX = offsetX < 0 ? offsetX + canvas.width : offsetX;
      ctx.fillRect(posX, 255, 12, 3);
    }

    if (!gameStarted) {
      cat.draw();
      ctx.fillStyle = '#451a03';
      ctx.font = 'bold 22px Courier New';
      ctx.textAlign = 'center';
      ctx.fillText('🐱 터치/버튼으로 시작!', canvas.width / 2, 120);
      ctx.font = '14px Courier New';
      ctx.fillText(`최고 기록: ${highScore}점`, canvas.width / 2, 150);
      requestAnimationFrame(gameLoop);
      return;
    }

    if (!gameOver) {
      score++;
      if (score > highScore) {
        highScore = score;
        localStorage.setItem('cat_high_score', highScore);
      }
    }

    cat.update();

    if (score >= nextHumanScore) {
      spawnHuman();
      nextHumanScore += 3000;
    }

    updateHuman();

    itemTimer++;
    if (itemTimer > 250 + Math.random() * 200) {
      createSpecialItem();
      itemTimer = 0;
    }

    for (let i = items.length - 1; i >= 0; i--) {
      const it = items[i];
      if (!gameOver) it.x -= it.speed;

      ctx.save();
      if (it.type === 'shield') ctx.fillStyle = '#0ea5e9';
      else if (it.type === 'catnip') ctx.fillStyle = '#10b981';
      else if (it.type === 'magnet') ctx.fillStyle = '#a855f7';
      else if (it.type === 'spray') ctx.fillStyle = '#f97316';
      
      ctx.beginPath();
      ctx.arc(it.x + 11, it.y + 11, 11, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 10px Courier New';
      ctx.textAlign = 'center';
      let icon = 'S';
      if (it.type === 'catnip') icon = 'N';
      if (it.type === 'magnet') icon = 'M';
      if (it.type === 'spray') icon = 'W';
      ctx.fillText(icon, it.x + 11, it.y + 15);
      ctx.restore();

      if (
        cat.x < it.x + it.width &&
        cat.x + cat.width > it.x &&
        cat.y < it.y + it.height &&
        cat.y + cat.height > it.y
      ) {
        audio.playCrunchSound();
        if (it.type === 'shield') {
          hasShield = true;
          floatingTexts.push({ x: it.x, y: it.y, text: 'SHIELD ON!', alpha: 1.0, vy: -1.5, color: '#38bdf8' });
        } else if (it.type === 'catnip') {
          catnipTimer = 300;
          floatingTexts.push({ x: it.x, y: it.y, text: 'CATNIP JUMP!', alpha: 1.0, vy: -1.5, color: '#34d399' });
        } else if (it.type === 'magnet') {
          magnetTimer = 300;
          floatingTexts.push({ x: it.x, y: it.y, text: 'MAGNET!', alpha: 1.0, vy: -1.5, color: '#c084fc' });
        } else if (it.type === 'spray') {
          sprayTimer = 180;
          floatingTexts.push({ x: it.x, y: it.y, text: 'WATER SPRAY!', alpha: 1.0, vy: -1.5, color: '#f97316' });
        }
        items.splice(i, 1);
      }
    }

    for (let i = treats.length - 1; i >= 0; i--) {
      const t = treats[i];
      if (!gameOver) {
        if (magnetTimer > 0) {
          const dx = (cat.x + cat.width/2) - (t.x + t.width/2);
          const dy = (cat.y + cat.height/2) - (t.y + t.height/2);
          const dist = Math.sqrt(dx*dx + dy*dy);
          if (dist < 180) {
            t.x += (dx / dist) * 6;
            t.y += (dy / dist) * 6;
          }
        }
        t.x += t.vx;
        t.y += t.vy;
        t.vy += t.gravity;

        if (t.y >= 222) {
          t.y = 222;
          t.vy = 0;
          t.vx = -3;
        }
      }

      ctx.save();
      if (t.type === 'can') {
        ctx.fillStyle = '#0284c7';
        ctx.fillRect(t.x, t.y + 3, t.width, t.height - 3);
        ctx.fillStyle = '#e2e8f0';
        ctx.fillRect(t.x, t.y, t.width, 3);
      } else if (t.type === 'churru') {
        ctx.fillStyle = '#f43f5e';
        ctx.fillRect(t.x, t.y, t.width, t.height);
      } else {
        ctx.fillStyle = '#d97706';
        ctx.fillRect(t.x, t.y + 2, 14, 10);
      }
      ctx.restore();

      if (
        cat.x < t.x + t.width &&
        cat.x + cat.width > t.x &&
        cat.y < t.y + t.height &&
        cat.y + cat.height > t.y
      ) {
        if (t.type === 'can') audio.playCanSound();
        else if (t.type === 'churru') audio.playChurruSound();
        else audio.playCrunchSound();

        addScoreAndCombo(t.points || 200, t.type === 'can' ? '#38bdf8' : (t.type === 'churru' ? '#fb7185' : '#fbbf24'), t.x, t.y);
        treats.splice(i, 1);
        fishesCollected++;
        continue;
      }
      if (t.x + t.width < 0) treats.splice(i, 1);
    }

    obstacleTimer++;
    if (obstacleTimer > 52 + Math.random() * 35) {
      createObstacle();
      obstacleTimer = 0;
    }

    fishTimer++;
    if (fishTimer > 110 + Math.random() * 60) {
      createFish();
      fishTimer = 0;
    }

    for (let i = fishes.length - 1; i >= 0; i--) {
      const f = fishes[i];
      if (!gameOver) f.x -= f.speed;

      const floatY = f.y + Math.sin(frame * 0.1 + f.bob) * 4;
      ctx.fillStyle = '#f97316';
      ctx.fillRect(f.x, floatY, 14, 10);

      if (
        cat.x < f.x + f.width &&
        cat.x + cat.width > f.x &&
        cat.y < floatY + f.height &&
        cat.y + cat.height > floatY
      ) {
        audio.playCrunchSound();
        addScoreAndCombo(150, '#f97316', f.x, floatY);
        fishes.splice(i, 1);
        fishesCollected++;
        continue;
      }
      if (f.x + f.width < 0) fishes.splice(i, 1);
    }

    for (let i = obstacles.length - 1; i >= 0; i--) {
      const obs = obstacles[i];
      if (!gameOver) obs.x -= obs.speed;

      ctx.fillStyle = obs.type === 'ball' ? '#ef4444' : '#b45309';
      ctx.fillRect(obs.x, obs.y, obs.width, obs.height);

      if (
        cat.x + 6 < obs.x + obs.width &&
        cat.x + cat.width - 6 > obs.x &&
        cat.y + 6 < obs.y + obs.height &&
        cat.y + cat.height > obs.y
      ) {
        if (isFever) {
          audio.playCrunchSound();
          floatingTexts.push({ x: obs.x, y: obs.y, text: '+500 DESTROY!', alpha: 1.0, vy: -1.5, color: '#ef4444' });
          score += 500;
          obstacles.splice(i, 1);
          continue;
        }

        if (invincibleTimer <= 0) {
          if (hasShield) {
            hasShield = false;
            invincibleTimer = 45;
            audio.playHitSound();
            floatingTexts.push({ x: cat.x, y: cat.y, text: 'SHIELD BLOCK!', alpha: 1.0, vy: -1.5, color: '#38bdf8' });
          } else {
            hp--;
            invincibleTimer = 60;
            audio.playHitSound();
            floatingTexts.push({ x: cat.x, y: cat.y, text: 'OUCH!', alpha: 1.0, vy: -1.5, color: '#ef4444' });

            if (hp <= 0 && !gameOver) {
              gameOver = true;
              audio.playGameOver();
            }
          }
        }
      }
      if (obs.x + obs.width < 0) obstacles.splice(i, 1);
    }

    if (sprayTimer > 0) {
      ctx.save();
      ctx.fillStyle = 'rgba(56, 189, 248, 0.4)';
      ctx.beginPath();
      ctx.arc(150, 100, 70, 0, Math.PI * 2);
      ctx.arc(420, 180, 90, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    for (let i = floatingTexts.length - 1; i >= 0; i--) {
      const ft = floatingTexts[i];
      if (!gameOver) {
        ft.y += ft.vy;
        ft.alpha -= 0.02;
      }
      ctx.save();
      ctx.globalAlpha = Math.max(0, ft.alpha);
      ctx.fillStyle = ft.color || '#fde047';
      ctx.font = 'bold 16px Courier New';
      ctx.textAlign = 'center';
      ctx.fillText(ft.text, ft.x, ft.y);
      ctx.restore();
      if (ft.alpha <= 0) floatingTexts.splice(i, 1);
    }

    ctx.fillStyle = '#451a03';
    ctx.font = 'bold 15px Courier New';
    ctx.textAlign = 'left';
    ctx.fillText(`SCORE: ${score}`, 15, 25);
    ctx.fillText(`BEST: ${highScore}`, 150, 25);

    let heartsText = '';
    for (let h = 0; h < maxHp; h++) {
      heartsText += h < hp ? '❤️' : '🖤';
    }
    ctx.fillText(heartsText, canvas.width - 90, 25);

    ctx.fillStyle = '#475569';
    ctx.fillRect(15, 33, 120, 8);
    ctx.fillStyle = isFever ? '#ef4444' : '#eab308';
    ctx.fillRect(15, 33, (feverGauge / 100) * 120, 8);
    ctx.strokeStyle = '#000';
    ctx.strokeRect(15, 33, 120, 8);

    if (gameOver) {
      ctx.fillStyle = 'rgba(0, 0, 0, 0.65)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#ffffff';
      ctx.textAlign = 'center';
      ctx.font = 'bold 26px Courier New';
      ctx.fillText('GAME OVER', canvas.width / 2, 110);
      ctx.font = '16px Courier New';
      ctx.fillStyle = '#fde047';
      ctx.fillText(`최종 점수: ${score}점 (간식 ${fishesCollected}개)`, canvas.width / 2, 150);
      ctx.fillStyle = '#ffffff';
      ctx.font = '14px Courier New';
      ctx.fillText('화면을 터치하여 다시 시작', canvas.width / 2, 190);
    }

    requestAnimationFrame(gameLoop);
  }

  gameLoop();
</script>
